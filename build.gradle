    plugins {
        id 'java'
        id 'eclipse'
        id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
        id 'com.github.johnrengelman.shadow' version '7.1.2' // Add the Shadow plugin
    }

    group = 'org.texbobcat'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
    }

    dependencies {
        compileOnly("com.velocitypowered:velocity-api:3.3.0-SNAPSHOT")
        annotationProcessor("com.velocitypowered:velocity-api:3.3.0-SNAPSHOT")
        implementation("com.mysql:mysql-connector-j:8.2.0")
    }

    def targetJavaVersion = 17
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(targetJavaVersion)
    }

    def templateSource = file('src/main/templates')
    def templateDest = layout.buildDirectory.dir('generated/sources/templates')
    def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
        def props = ['version': project.version]
        task.inputs.properties props

        task.from templateSource
        task.into templateDest
        task.expand props
    }

    sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

    project.idea.project.settings.taskTriggers.afterSync generateTemplates
    project.eclipse.synchronizationTasks(generateTemplates)

    // Configure Shadow Jar to relocate HikariCP classes
    tasks.named('shadowJar') {
        archiveClassifier.set('all') // Produces a JAR with dependencies included
    }

    // Make shadowJar the default JAR task to build with dependencies included
    tasks.build.dependsOn(tasks.shadowJar)
